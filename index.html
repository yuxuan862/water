<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>旅行規劃師 (Travel Planner Vibe)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'PingFang TC', 'Microsoft JhengHei', 'sans-serif'],
                    },
                    colors: {
                        primary: '#4F46E5', // indigo-600
                        secondary: '#F59E0B', // amber-500
                    }
                }
            }
        }
    </script>
    <style>
        body {
            font-family: 'Inter', 'PingFang TC', 'Microsoft JhengHei', sans-serif;
            background-color: #F8FAFC;
            background-image: radial-gradient(circle at top right, #E0E7FF 0%, transparent 40%),
                              radial-gradient(circle at bottom left, #FEF3C7 0%, transparent 40%);
            background-attachment: fixed;
        }
        
        .glass-card {
            background-color: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(226, 232, 240, 0.6);
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -1px rgba(0, 0, 0, 0.03);
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #CBD5E1; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: #94A3B8; }

        .loader {
            border: 3px solid #f3f3f3;
            border-radius: 50%;
            border-top: 3px solid #4F46E5;
            width: 24px;
            height: 24px;
            -webkit-animation: spin 1s linear infinite;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body class="text-slate-800 min-h-screen flex flex-col">

    <nav class="glass-card sticky top-0 z-50 px-6 py-4 flex justify-between items-center">
        <div class="flex items-center gap-2">
            <span class="text-2xl">🔮</span>
            <h1 class="text-xl font-bold text-slate-800">
                <span data-i18n="navTitle">旅行規劃師</span> 
                <span class="text-sm font-normal text-slate-500 hidden sm:inline" data-i18n="navSubtitle">| Travel Planner Vibe</span>
            </h1>
        </div>
        <div class="flex items-center gap-4">
            <select id="lang-switcher" class="text-sm font-medium border border-slate-300 text-slate-600 rounded-lg px-2 py-1 bg-white/80 outline-none hover:border-primary transition-colors focus:ring-2 focus:ring-primary/20">
                <option value="zh-TW">繁體中文</option>
                <option value="en">English</option>
                <option value="ja">日本語</option>
                <option value="ko">한국어</option>
            </select>
            
            <button id="btn-login-nav" class="text-slate-600 hover:text-primary transition-colors flex items-center gap-2 font-medium">
                <i class="fas fa-user-circle"></i> <span class="hidden sm:inline" data-i18n="navLogin">登入</span>
            </button>
            <div id="user-profile-nav" class="hidden items-center gap-3">
                <span id="user-email-display" class="text-sm text-slate-500 font-medium hidden md:inline"></span>
                <button id="btn-logout-nav" class="text-slate-400 hover:text-red-500 transition-colors p-1" title="Logout">
                    <i class="fas fa-sign-out-alt"></i>
                </button>
            </div>

            <button id="btn-history" class="text-slate-600 hover:text-primary transition-colors flex items-center gap-2 font-medium">
                <i class="fas fa-history"></i> <span class="hidden sm:inline" data-i18n="navHistory">歷史紀錄</span>
            </button>
        </div>
    </nav>

    <main class="flex-1 max-w-7xl w-full mx-auto p-4 sm:p-6 flex flex-col lg:flex-row gap-6">
        
        <!-- Left Column: Input Form -->
        <aside class="w-full lg:w-1/3 flex flex-col gap-4">
            <div class="glass-card rounded-2xl p-6">
                <h2 class="text-lg font-bold mb-4 flex items-center gap-2">
                    <i class="fas fa-sliders-h text-primary"></i> <span data-i18n="formTitle">規劃條件</span>
                </h2>
                
                <form id="planner-form" class="space-y-4">
                    <div>
                        <label class="block text-sm font-medium text-slate-600 mb-1" data-i18n="destLabel">目的地</label>
                        <input type="text" id="input-destination" required data-i18n-ph="destPh" placeholder="例如：台南市中西區" class="w-full px-4 py-2 rounded-lg border border-slate-300 focus:ring-2 focus:ring-primary focus:border-primary outline-none transition-all">
                    </div>
                    
                    <div class="grid grid-cols-2 gap-4">
                        <div>
                            <label class="block text-sm font-medium text-slate-600 mb-1" data-i18n="originLabel">出發地點</label>
                            <input type="text" id="input-origin" required data-i18n-ph="originPh" placeholder="例如：台南火車站" class="w-full px-4 py-2 rounded-lg border border-slate-300 focus:ring-2 focus:ring-primary outline-none transition-all">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-slate-600 mb-1" data-i18n="dateLabel">日期</label>
                            <input type="date" id="input-date" required class="w-full px-4 py-2 rounded-lg border border-slate-300 focus:ring-2 focus:ring-primary outline-none transition-all">
                        </div>
                    </div>

                    <div class="grid grid-cols-2 gap-4">
                        <div>
                            <label class="block text-sm font-medium text-slate-600 mb-1" data-i18n="budgetLabel">總預算 (TWD)</label>
                            <input type="number" id="input-budget" required min="0" placeholder="3000" class="w-full px-4 py-2 rounded-lg border border-slate-300 focus:ring-2 focus:ring-primary outline-none transition-all">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-slate-600 mb-1" data-i18n="paxLabel">人數</label>
                            <input type="number" id="input-pax" required min="1" value="2" class="w-full px-4 py-2 rounded-lg border border-slate-300 focus:ring-2 focus:ring-primary outline-none transition-all">
                        </div>
                    </div>

                    <div class="grid grid-cols-2 gap-4">
                        <div>
                            <label class="block text-sm font-medium text-slate-600 mb-1" data-i18n="startLabel">出發時間</label>
                            <input type="time" id="input-start-time" required value="09:00" class="w-full px-4 py-2 rounded-lg border border-slate-300 focus:ring-2 focus:ring-primary outline-none transition-all">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-slate-600 mb-1" data-i18n="endLabel">結束時間</label>
                            <input type="time" id="input-end-time" required value="20:00" class="w-full px-4 py-2 rounded-lg border border-slate-300 focus:ring-2 focus:ring-primary outline-none transition-all">
                        </div>
                    </div>

                    <div>
                        <label class="block text-sm font-medium text-slate-600 mb-1" data-i18n="transportLabel">交通方式</label>
                        <select id="input-transport" class="w-full px-4 py-2 rounded-lg border border-slate-300 focus:ring-2 focus:ring-primary outline-none bg-white">
                            <option value="public" data-i18n="transPublic">大眾運輸</option>
                            <option value="car" data-i18n="transCar">開車</option>
                            <option value="motorcycle" data-i18n="transMoto">機車</option>
                            <option value="walk" data-i18n="transWalk">步行</option>
                        </select>
                    </div>

                    <div class="pt-4 border-t border-slate-200">
                        <h3 class="text-sm font-bold text-slate-700 mb-3" data-i18n="prefTitle">偏好設定</h3>
                        
                        <div class="mb-3">
                            <label class="block text-xs font-medium text-slate-500 mb-1" data-i18n="typeLabel">旅遊類型 (可複選)</label>
                            <div class="flex flex-wrap gap-2" id="travel-types-container">
                                <!-- Checkboxes generated dynamically by JS for i18n -->
                            </div>
                        </div>

                        <div class="grid grid-cols-2 gap-3 mb-3">
                            <div>
                                <label class="block text-xs font-medium text-slate-500 mb-1" data-i18n="styleLabel">旅遊風格</label>
                                <select id="input-style" class="w-full text-sm px-3 py-2 rounded border border-slate-300 bg-white">
                                    <option value="relax" data-i18n="styleRelax">放鬆慢活</option>
                                    <option value="packed" data-i18n="stylePacked">充實緊湊</option>
                                    <option value="photo" data-i18n="stylePhoto">打卡拍照</option>
                                </select>
                            </div>
                            <div>
                                <label class="block text-xs font-medium text-slate-500 mb-1" data-i18n="companionLabel">同行對象</label>
                                <select id="input-companion" class="w-full text-sm px-3 py-2 rounded border border-slate-300 bg-white">
                                    <option value="couple" data-i18n="compCouple">情侶</option>
                                    <option value="solo" data-i18n="compSolo">獨旅</option>
                                    <option value="friends" data-i18n="compFriends">朋友</option>
                                    <option value="family" data-i18n="compFamily">家庭(長輩/小孩友善)</option>
                                </select>
                            </div>
                        </div>

                        <div class="grid grid-cols-2 gap-3">
                            <div>
                                <label class="block text-xs font-medium text-slate-500 mb-1" data-i18n="walkLabel">步行接受度</label>
                                <select id="input-walking" class="w-full text-sm px-3 py-2 rounded border border-slate-300 bg-white">
                                    <option value="medium" data-i18n="walkMed">中等</option>
                                    <option value="low" data-i18n="walkLow">低 (少走路)</option>
                                    <option value="high" data-i18n="walkHigh">高 (愛走路)</option>
                                </select>
                            </div>
                            <div>
                                <label class="block text-xs font-medium text-slate-500 mb-1" data-i18n="indoorLabel">室內/戶外</label>
                                <select id="input-indoor" class="w-full text-sm px-3 py-2 rounded border border-slate-300 bg-white">
                                    <option value="balanced" data-i18n="indBalanced">均衡</option>
                                    <option value="indoor" data-i18n="indIndoor">全室內</option>
                                    <option value="outdoor" data-i18n="indOutdoor">戶外為主</option>
                                </select>
                            </div>
                        </div>
                    </div>

                    <button type="submit" id="btn-generate" class="w-full mt-4 bg-primary hover:bg-indigo-700 text-white font-bold py-3 px-4 rounded-xl shadow-lg shadow-indigo-200 transition-all flex justify-center items-center gap-2">
                        <span id="btn-generate-text" data-i18n="btnGenerate">生成完美行程</span>
                        <i class="fas fa-magic"></i>
                    </button>
                </form>
            </div>
        </aside>

        <!-- Right Column: Results Display -->
        <section class="w-full lg:w-2/3 flex flex-col gap-4">
            
            <!-- Default State -->
            <div id="empty-state" class="glass-card rounded-2xl p-12 flex flex-col items-center justify-center text-center h-full min-h-[400px]">
                <div class="text-6xl mb-4">🗺️</div>
                <h3 class="text-xl font-bold text-slate-700 mb-2" data-i18n="emptyTitle">等待您的指示</h3>
                <p class="text-slate-500 max-w-md" data-i18n="emptyDesc">在左側輸入您的目的地、預算與喜好，我們的 AI 規劃師將為您量身打造專屬的一日遊行程，包含時間軸、交通與雨天備案！</p>
            </div>

            <!-- Loading State -->
            <div id="loading-state" class="hidden glass-card rounded-2xl p-12 flex flex-col items-center justify-center text-center h-full min-h-[400px]">
                <div class="loader mb-6"></div>
                <h3 class="text-lg font-bold text-slate-700 mb-2" data-i18n="loadingTitle">AI 規劃師正在燒腦中...</h3>
                <p class="text-slate-500 text-sm" data-i18n="loadingDesc">正在考慮地理鄰近性、計算預算與準備雨天備案</p>
            </div>

            <!-- Results State -->
            <div id="results-state" class="hidden flex-col gap-6">
                <!-- Header -->
                <div class="glass-card rounded-2xl p-6 relative overflow-hidden">
                    <div class="absolute top-0 right-0 w-32 h-32 bg-secondary opacity-10 rounded-bl-full -z-10"></div>
                    <div class="flex justify-between items-start">
                        <div>
                            <h2 id="res-title" class="text-2xl font-bold text-slate-800 mb-2"></h2>
                            <p id="res-summary" class="text-slate-600 mb-4"></p>
                        </div>
                        <button id="btn-save" class="bg-white border border-slate-200 hover:border-primary text-slate-700 hover:text-primary px-4 py-2 rounded-lg text-sm font-medium transition-all shadow-sm flex items-center gap-2">
                            <i class="far fa-bookmark"></i> <span id="btn-save-text" data-i18n="btnSave">儲存</span>
                        </button>
                    </div>
                    
                    <!-- Budget Summary -->
                    <div class="grid grid-cols-2 sm:grid-cols-4 gap-4 mt-2 p-4 bg-slate-50 rounded-xl border border-slate-100">
                        <div>
                            <p class="text-xs text-slate-500 font-medium" data-i18n="budgetTotal">總預算估算</p>
                            <p class="text-lg font-bold text-primary" id="res-budget-total">$0</p>
                        </div>
                        <div>
                            <p class="text-xs text-slate-500 font-medium" data-i18n="budgetFood">餐飲</p>
                            <p class="text-md font-semibold text-slate-700" id="res-budget-food">$0</p>
                        </div>
                        <div>
                            <p class="text-xs text-slate-500 font-medium" data-i18n="budgetTicket">門票/活動</p>
                            <p class="text-md font-semibold text-slate-700" id="res-budget-tickets">$0</p>
                        </div>
                        <div>
                            <p class="text-xs text-slate-500 font-medium" data-i18n="budgetMisc">交通/其他</p>
                            <p class="text-md font-semibold text-slate-700" id="res-budget-misc">$0</p>
                        </div>
                    </div>
                    <div class="mt-3 text-xs text-slate-500 flex items-start gap-1">
                        <i class="fas fa-info-circle mt-0.5"></i>
                        <span id="res-ai-notes"></span>
                    </div>
                </div>

                <!-- Timeline -->
                <div class="glass-card rounded-2xl p-6">
                    <h3 class="text-lg font-bold text-slate-800 mb-6 flex items-center gap-2">
                        <i class="far fa-clock text-primary"></i> <span data-i18n="timelineTitle">行程時間軸</span>
                    </h3>
                    
                    <div class="relative border-l-2 border-indigo-100 ml-3 md:ml-4 space-y-8" id="timeline-container">
                        <!-- Timeline items injected here -->
                    </div>
                </div>
            </div>

        </section>
    </main>

    <footer class="py-6 text-center text-slate-400 text-sm">
        <p>© 2026 TonyStudio (TONY 楊文澤顧問). All rights reserved.</p>
    </footer>

    <!-- Modals -->
    <div id="alert-modal" class="hidden fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-[100] flex items-center justify-center p-4">
        <div class="bg-white rounded-2xl p-6 max-w-sm w-full shadow-2xl transform transition-all">
            <h3 id="alert-title" class="text-lg font-bold text-slate-800 mb-2">通知</h3>
            <p id="alert-message" class="text-slate-600 mb-6">訊息內容</p>
            <button id="alert-close" class="w-full bg-slate-100 hover:bg-slate-200 text-slate-800 font-medium py-2 rounded-lg transition-colors" data-i18n="modalConfirm">確認</button>
        </div>
    </div>

    <!-- History Drawer -->
    <div id="history-drawer" class="hidden fixed inset-0 z-[90] flex justify-end">
        <div id="history-backdrop" class="absolute inset-0 bg-slate-900/30 backdrop-blur-sm"></div>
        <div class="relative w-full max-w-md bg-white h-full shadow-2xl flex flex-col animate-slide-in">
            <div class="p-6 border-b border-slate-100 flex justify-between items-center">
                <h2 class="text-lg font-bold text-slate-800" data-i18n="historyTitle">歷史行程紀錄</h2>
                <button id="history-close" class="text-slate-400 hover:text-slate-700 p-2"><i class="fas fa-times text-xl"></i></button>
            </div>
            <div id="history-list" class="flex-1 overflow-y-auto p-4 space-y-4 bg-slate-50">
                <div class="text-center text-slate-500 py-10" data-i18n="historyEmpty">尚無儲存的行程紀錄</div>
            </div>
        </div>
    </div>

    <!-- Auth Modal -->
    <div id="auth-modal" class="hidden fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-[100] flex items-center justify-center p-4">
        <div class="bg-white rounded-2xl p-6 max-w-md w-full shadow-2xl relative transform transition-all">
            <button id="auth-close" class="absolute top-4 right-4 text-slate-400 hover:text-slate-700"><i class="fas fa-times text-xl"></i></button>
            <h2 class="text-2xl font-bold text-slate-800 mb-6 text-center" data-i18n="authTitle">登入 / 註冊</h2>
            
            <div class="space-y-4 mb-6">
                <div>
                    <label class="block text-sm font-medium text-slate-600 mb-1" data-i18n="authEmail">電子郵件</label>
                    <input type="email" id="auth-email" class="w-full px-4 py-2 rounded-lg border border-slate-300 focus:ring-2 focus:ring-primary outline-none transition-all">
                </div>
                <div>
                    <label class="block text-sm font-medium text-slate-600 mb-1" data-i18n="authPassword">密碼</label>
                    <input type="password" id="auth-password" class="w-full px-4 py-2 rounded-lg border border-slate-300 focus:ring-2 focus:ring-primary outline-none transition-all">
                </div>
                <div class="flex gap-3">
                    <button id="btn-email-signin" class="flex-1 bg-primary hover:bg-indigo-700 text-white font-bold py-2 px-4 rounded-lg transition-colors shadow-sm" data-i18n="btnSignIn">登入</button>
                    <button id="btn-email-signup" class="flex-1 bg-white border border-slate-300 hover:border-primary text-slate-700 font-bold py-2 px-4 rounded-lg transition-colors shadow-sm" data-i18n="btnSignUp">註冊</button>
                </div>
            </div>
            
            <div class="relative flex py-2 items-center mb-6">
                <div class="flex-grow border-t border-slate-200"></div>
                <span class="flex-shrink-0 mx-4 text-slate-400 text-sm font-medium">OR</span>
                <div class="flex-grow border-t border-slate-200"></div>
            </div>
            
            <div class="space-y-3">
                <button id="btn-google-login" class="w-full bg-white border border-slate-300 hover:bg-slate-50 text-slate-700 font-bold py-2.5 px-4 rounded-lg transition-colors shadow-sm flex items-center justify-center gap-3">
                    <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" class="w-5 h-5" alt="Google">
                    <span data-i18n="authGoogle">使用 Google 登入</span>
                </button>
                <button id="btn-guest-login" class="w-full bg-slate-100 hover:bg-slate-200 text-slate-600 font-bold py-2.5 px-4 rounded-lg transition-colors" data-i18n="authGuest">以訪客繼續 (匿名)</button>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, signInWithCustomToken, GoogleAuthProvider, signInWithPopup, createUserWithEmailAndPassword, signInWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, setDoc, collection, getDocs, serverTimestamp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // User provided Firebase Config
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'travel-planner-vibe';
        const firebaseConfig = {
            apiKey: "AIzaSyAxj2zgJ7P24Ro30RKgPcye7P4NOXd9ghE",
            authDomain: "water-520ed.firebaseapp.com",
            projectId: "water-520ed",
            storageBucket: "water-520ed.firebasestorage.app",
            messagingSenderId: "275145326722",
            appId: "1:275145326722:web:ff98b8b5ee00da8b0db49b",
            measurementId: "G-RSTZ49QJWQ"
        };

        let db = null;
        let auth = null;
        let currentUserId = null;
        let isFirebaseActive = Object.keys(firebaseConfig).length > 0;

        if (isFirebaseActive) {
            try {
                const app = initializeApp(firebaseConfig);
                db = getFirestore(app);
                auth = getAuth(app);
                
                // Enhanced Auth Flow handling Custom Token Mismatches gracefully
                if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                    try {
                        await signInWithCustomToken(auth, __initial_auth_token);
                    } catch (tokenError) {
                        console.warn("Custom token validation failed, falling back to anonymous auth.", tokenError);
                        await signInAnonymously(auth);
                    }
                } else {
                    await signInAnonymously(auth);
                }
                currentUserId = auth.currentUser?.uid;
                setupAuthListeners();
            } catch (error) {
                console.error("Firebase init failed", error);
                isFirebaseActive = false;
            }
        }
        
        function setupAuthListeners() {
            onAuthStateChanged(auth, (user) => {
                const btnLoginNav = document.getElementById('btn-login-nav');
                const userProfileNav = document.getElementById('user-profile-nav');
                const userEmailDisplay = document.getElementById('user-email-display');
                
                if (user) {
                    currentUserId = user.uid;
                    // 若為訪客，顯示登入按鈕；若為已註冊帳號，顯示 email 及登出
                    if (user.isAnonymous) {
                        btnLoginNav.classList.remove('hidden');
                        userProfileNav.classList.add('hidden');
                        userProfileNav.classList.remove('flex');
                    } else {
                        btnLoginNav.classList.add('hidden');
                        userProfileNav.classList.remove('hidden');
                        userProfileNav.classList.add('flex');
                        userEmailDisplay.innerText = user.email || user.displayName || '使用者';
                    }
                } else {
                    currentUserId = null;
                    btnLoginNav.classList.remove('hidden');
                    userProfileNav.classList.add('hidden');
                    userProfileNav.classList.remove('flex');
                }
            });
        }

        // --- I18N Dictionary ---
        const i18n = {
            'zh-TW': {

        const langPromptMap = {

        // --- Streamlined UI Updates & Translation Applier ---
        function applyTranslations(lang) {
            currentLang = lang;
            document.querySelectorAll('[data-i18n]').forEach(el => {

                }
            });

            // Re-render itinerary if it exists to refresh dynamic lang items
            if(currentGeneratedItinerary && !document.getElementById('results-state').classList.contains('hidden')) {
                renderItinerary(currentGeneratedItinerary);
            }

        // --- STREAMING_CHUNK:Gemini API Calling & Prompt Construction ---
        async function fetchItineraryFromGemini(params) {
            const apiKey = ""; // Canvas runtime injects key
            const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-3-flash-preview:generateContent?key=${apiKey}`;
            const targetLangName = langPromptMap[currentLang];

            const systemPrompt = `You are a professional "Travel Planner". Create a logical, well-paced 1-day itinerary with rainy day backups based on user inputs.
Rules:
1. Respect geographic proximity to avoid backtracking.
2. Ensure realistic budget and time estimates. If constraints conflict, balance them and explain in aiNotes.
3. STRICT JSON SCHEMA: Do NOT include markdown blocks (\`\`\`json). Output raw JSON.
4. CRITICAL: The entire JSON output MUST be in ${targetLangName}.

JSON Schema:
{
  "tripTitle": "String",
  "summary": "String",
  "budgetSummary": {
    "totalEstimated": Number,
    "food": Number,
    "tickets": Number,
    "transport": Number,
    "misc": Number
  },
  "aiNotes": "String (Suggestions or compromise notes)",
  "timeline": [
    {
      "time": "String (e.g., 09:30 - 11:00)",
      "spotName": "String",
      "category": "String (food/culture/nature/shopping etc)",
      "costEstimate": Number,
      "description": "String (Details and tips)",
      "transportToNext": {
        "mode": "String",
        "durationMinutes": Number,
        "note": "String"
      },
      "rainyBackup": {
        "spotName": "String",
        "reason": "String"
      }
    }
  ]
}`;

            // We use raw option values in english to make the prompt robust
            const userPrompt = `Generate a 1-day itinerary:
- Destination: ${params.destination}
- Origin: ${params.origin}
- Date: ${params.date}
- Total Budget: ${params.budget}
- Pax: ${params.pax}
- Start Time: ${params.startTime}
- End Time: ${params.endTime}
- Transport: ${params.transport}
- Preferences (Types): ${params.types.join(', ')}
- Style: ${params.style}
- Companion: ${params.companion}
- Walking Tolerance: ${params.walking}
- Indoor/Outdoor: ${params.indoor}
Please reply in ${targetLangName}.`;

            const payload = {
                contents: [{ parts: [{ text: userPrompt }] }],
                systemInstruction: { parts: [{ text: systemPrompt }] },
                generationConfig: { responseMimeType: "application/json" }
            };

            const response = await fetch(apiUrl, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });

            if (!response.ok) {
                if (response.status === 429) throw new Error("API Rate Limit exceeded (429). Please try again in 30 seconds.");
                throw new Error("Failed to generate itinerary.");
            }

            const result = await response.json();
            const text = result.candidates?.[0]?.content?.parts?.[0]?.text;
            if (!text) throw new Error("Empty response from AI");

            try {
                const cleanText = text.replace(/```json/gi, '').replace(/```/g, '').trim();
                return JSON.parse(cleanText);
            } catch (e) {
                console.error("JSON Parse Error:", e, text);
                throw new Error("Invalid JSON format from AI.");
            }
        }

        // --- STREAMING_CHUNK:Rendering Results into the DOM ---
        function renderItinerary(data) {

            document.getElementById('res-summary').innerText = data.summary || "";
            
            document.getElementById('res-budget-total').innerText = `$${data.budgetSummary?.totalEstimated || 0}`;

            document.getElementById('res-budget-misc').innerText = `$${(data.budgetSummary?.transport || 0) + (data.budgetSummary?.misc || 0)}`;
            
            document.getElementById('res-ai-notes').innerText = data.aiNotes || "";

            const container = document.getElementById('timeline-container');

                let transportHtml = '';
                if (!isLast && item.transportToNext) {

                            </div>

                }

                const itemHtml = `

                        <div class="absolute -left-8 md:-left-9 mt-1.5 w-6 h-6 rounded-full bg-white border-4 border-indigo-200 flex items-center justify-center shadow-sm">

        }

        form.addEventListener('submit', async (e) => {

                companion: document.getElementById('input-companion').value,
                walking: document.getElementById('input-walking').value,
                indoor: document.getElementById('input-indoor').value
            };

            emptyState.classList.add('hidden');
            resultsState.classList.add('hidden');
            loadingState.classList.remove('hidden');
            btnGenerate.disabled = true;
            btnGenerateText.innerText = i18n[currentLang]['genLoading'];

            try {
                let data = null;
                try {
                    data = await fetchItineraryFromGemini(params);
                } catch (err) {
                    console.warn("Retrying due to API error...", err);
                    data = await fetchItineraryFromGemini(params);
                }

                currentGeneratedItinerary = { metadata: params, ...data };
                renderItinerary(data);
                
                loadingState.classList.add('hidden');
                resultsState.classList.remove('hidden');
                resultsState.classList.add('flex');
            } catch (error) {
                console.error("Generate error:", error);
                showAlert('modalNotice', error.message, true);
                emptyState.classList.remove('hidden');
                loadingState.classList.add('hidden');
            } finally {
                btnGenerate.disabled = false;
                btnGenerateText.innerText = i18n[currentLang]['btnGenerate'];
            }
        });

        // --- STREAMING_CHUNK:Firebase Save & Load Operations ---
        btnSave.addEventListener('click', async () => {
            if (!currentGeneratedItinerary) return;
            
            if (!isFirebaseActive || !currentUserId) {
                showAlert("modalNotice", "alertOffline");
                return;
            }

            btnSaveText.innerText = i18n[currentLang]['btnSaving'];
            btnSave.disabled = true;

            try {
                const itineraryId = 'itin_' + Date.now() + '_' + Math.random().toString(36).substr(2, 5);
                const docRef = doc(db, 'artifacts', appId, 'users', currentUserId, 'itineraries', itineraryId);
                
                const docData = {
                    id: itineraryId,
                    createdAt: serverTimestamp(),
                    ...currentGeneratedItinerary
                };

                await setDoc(docRef, docData);
                showAlert("modalNotice", "alertSaveSuccess");
            } catch (error) {
                console.error("Save error:", error);
                showAlert("modalNotice", "alertSaveFail");
            } finally {
                btnSaveText.innerText = i18n[currentLang]['btnSave'];
                btnSave.disabled = false;
            }
        });

        const historyDrawer = document.getElementById('history-drawer');
        const historyList = document.getElementById('history-list');

        function toggleHistory(show) {
            if (show) {
                historyDrawer.classList.remove('hidden');
                loadHistory();
            } else {
                historyDrawer.classList.add('hidden');
            }
        }

        document.getElementById('btn-history').addEventListener('click', () => toggleHistory(true));
        document.getElementById('history-close').addEventListener('click', () => toggleHistory(false));
        document.getElementById('history-backdrop').addEventListener('click', () => toggleHistory(false));

        // --- Auth Modals & Logic ---
        const authModal = document.getElementById('auth-modal');
        const authClose = document.getElementById('auth-close');
        
        document.getElementById('btn-login-nav')?.addEventListener('click', () => {
            authModal.classList.remove('hidden');
        });
        
        authClose?.addEventListener('click', () => {
            authModal.classList.add('hidden');
        });
        
        document.getElementById('btn-guest-login')?.addEventListener('click', async () => {
            authModal.classList.add('hidden');
            if(!auth.currentUser) {
                await signInAnonymously(auth);
            }
        });

        document.getElementById('btn-google-login')?.addEventListener('click', async () => {
            try {
                const provider = new GoogleAuthProvider();
                await signInWithPopup(auth, provider);
                authModal.classList.add('hidden');
                showAlert('modalNotice', '登入成功！ / Login Successful!', true);
            } catch (error) {
                console.error(error);
                showAlert('modalNotice', error.message, true);
            }
        });

        document.getElementById('btn-email-signin')?.addEventListener('click', async () => {
            const email = document.getElementById('auth-email').value;
            const pass = document.getElementById('auth-password').value;
            if(!email || !pass) return showAlert('modalNotice', '請輸入電子郵件與密碼 / Enter email & password', true);
            try {
                await signInWithEmailAndPassword(auth, email, pass);
                authModal.classList.add('hidden');
                showAlert('modalNotice', '登入成功！ / Login Successful!', true);
            } catch (error) {
                console.error(error);
                showAlert('modalNotice', error.message, true);
            }
        });

        document.getElementById('btn-email-signup')?.addEventListener('click', async () => {
            const email = document.getElementById('auth-email').value;
            const pass = document.getElementById('auth-password').value;
            if(!email || !pass) return showAlert('modalNotice', '請輸入電子郵件與密碼 / Enter email & password', true);
            try {
                await createUserWithEmailAndPassword(auth, email, pass);
                authModal.classList.add('hidden');
                showAlert('modalNotice', '註冊成功！ / Signup Successful!', true);
            } catch (error) {
                console.error(error);
                showAlert('modalNotice', error.message, true);
            }
        });

        document.getElementById('btn-logout-nav')?.addEventListener('click', async () => {
            await signOut(auth);
            // 登出後自動退回匿名狀態以維持應用程式運作
            await signInAnonymously(auth);
            showAlert('modalNotice', '已登出。 / Logged out.', true);
        });

        async function loadHistory() {
            if (!isFirebaseActive || !currentUserId) {
                historyList.innerHTML = `<div class="text-center text-slate-500 py-10">${i18n[currentLang]['alertOffline']}</div>`;
                return;
            }

            historyList.innerHTML = '<div class="text-center py-10"><i class="fas fa-spinner fa-spin text-primary text-2xl"></i></div>';

            try {
                const collRef = collection(db, 'artifacts', appId, 'users', currentUserId, 'itineraries');
                const snapshot = await getDocs(collRef);
                
                if (snapshot.empty) {
                    historyList.innerHTML = `<div class="text-center text-slate-500 py-10">${i18n[currentLang]['historyEmpty']}</div>`;
                    return;
                }

                let items = [];
                snapshot.forEach(doc => items.push(doc.data()));
                items.sort((a, b) => {
                    const timeA = a.createdAt?.toMillis ? a.createdAt.toMillis() : 0;
                    const timeB = b.createdAt?.toMillis ? b.createdAt.toMillis() : 0;
                    return timeB - timeA;
                });

                historyList.innerHTML = '';
                items.forEach(item => {
                    const dateStr = item.metadata?.date || '-';
                    const title = item.tripTitle || 'Itinerary';
                    const card = document.createElement('div');
                    card.className = "bg-white p-4 rounded-xl border border-slate-200 shadow-sm hover:shadow-md transition-shadow cursor-pointer";
                    card.innerHTML = `
                        <div class="text-xs text-slate-400 mb-1">${dateStr} • ${item.metadata?.destination || '-'}</div>
                        <h4 class="font-bold text-slate-700">${title}</h4>
                        <div class="text-xs text-slate-500 mt-2 flex gap-2">
                            <span><i class="fas fa-coins text-secondary"></i> $${item.budgetSummary?.totalEstimated || 0}</span>
                            <span><i class="fas fa-users text-indigo-400"></i> ${item.metadata?.pax || 1}</span>
                        </div>
                    `;
                    card.addEventListener('click', () => {
                        currentGeneratedItinerary = item;
                        renderItinerary(item);
                        emptyState.classList.add('hidden');
                        loadingState.classList.add('hidden');
                        resultsState.classList.remove('hidden');
                        resultsState.classList.add('flex');
                        toggleHistory(false);
                        window.scrollTo({ top: 0, behavior: 'smooth' });
                    });
                    historyList.appendChild(card);
                });
            } catch (error) {
                console.error("Load history error:", error);
                historyList.innerHTML = `<div class="text-center text-red-500 py-10">${i18n[currentLang]['alertSaveFail']}</div>`;
            }
        }
    </script>
</body>
</html>
